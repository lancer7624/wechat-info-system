name: 功能建议
description: 想要的新功能或改进
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        说说你的**使用场景**——「谁在什么情况下想要什么结果」比「加个 XX 功能」有用得多。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你现在怎么用的？遇到什么不方便？希望变成什么样？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案
      description: 现有功能里有没有能凑合用的？为什么不够？
    validations:
      required: false
